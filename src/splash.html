<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinebroad</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #050505 0%, #1a0505 45%, #3b0000 100%);
            color: white;
            font-family: 'Segoe UI', 'Outfit', sans-serif;
            overflow: hidden;
            border-radius: 12px;
            user-select: none;
            cursor: default;
            border: 1px solid #330000;
            -webkit-app-region: drag;
        }

        .brand-mark {
            width: 96px;
            height: 96px;
            margin-bottom: 18px;
            animation: float 2.2s infinite ease-in-out;
            filter: drop-shadow(0 0 18px rgba(229, 9, 20, 0.45));
        }

        .brand-mark img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 22px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .ripple {
            width: 72px;
            height: 10px;
            background: radial-gradient(circle, rgba(229,9,20,0.55) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            margin-bottom: 22px;
            animation: ripple-anim 2.2s infinite ease-in-out;
        }

        @keyframes ripple-anim {
            0%, 100% { transform: scale(0.85); opacity: 0.55; }
            50% { transform: scale(1.45); opacity: 0.15; }
        }

        h2 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        p#status {
            margin-top: 8px;
            font-size: 13px;
            color: #ff8a8a;
            letter-spacing: 0.4px;
        }

        .footer {
            position: absolute;
            bottom: 16px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .version {
            font-size: 11px;
            color: #666;
            font-family: monospace;
        }

        .credit {
            font-size: 10px;
            color: #b00000;
            font-weight: 700;
            opacity: 0.85;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="brand-mark">
        <img src="assets/cinebroad-logo.png" alt="Cinebroad" />
    </div>

    <div class="ripple"></div>

    <h2>Cinebroad</h2>
    <p id="status">Initializing...</p>

    <div class="footer">
        <span class="version" id="version">v1.1.3</span>
        <span class="credit">Cinebroad Desktop</span>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const statusElement = document.getElementById('status');
        const versionElement = document.getElementById('version');

        ipcRenderer.on('update-status', (event, message) => {
            statusElement.innerText = message;
        });

        ipcRenderer.on('app-version', (event, version) => {
            versionElement.innerText = `v${version}`;
        });
    </script>
</body>
</html>
